# GitLab Pages for the tracklog viewer.
#
# The site is one static HTML file. Nothing is built here — building needs the IGC
# files, and flight tracks stay out of this repository (`*.igc` is ignored). Reports are
# built locally and the output is committed under `public/`:
#
#   uv run python -m tracklog_viewer.cli FLIGHT.igc [...] \
#       --terrain --meteo --online --html public/index.html
#
# `--online` is the reason for being on Pages at all. A published artifact runs under a
# policy that blocks every external host, which is what forced embedded imagery, an
# embedded DEM, a flat plane for uploaded tracks and a fake fullscreen. A page served
# from Pages can fetch, so imagery comes at view time at zoom 12–13 (10–20 m/px against
# the ~45 an embedded JPEG affords), weather works for a track the reader uploads, and
# the Fullscreen API is allowed.

stages: [test, deploy]

# The image carries uv and no Python at all — deliberately. Pinning an interpreter here
# as well as in `requires-python` is what let three versions drift apart (a 3.11 venv, a
# `>=3.12` floor, a 3.12 image, no two agreeing). `uv sync` reads `.python-version`,
# downloads that interpreter and refuses to build a venv that violates `requires-python`,
# so the version lives in one place and CI cannot disagree with a developer's machine.
#
# `--locked` is the other half: it fails if `uv.lock` does not match `pyproject.toml`
# rather than quietly resolving something newer. An upstream release can no longer turn
# this pipeline red on its own.
.uv:
  image: ghcr.io/astral-sh/uv:bookworm-slim
  interruptible: true
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.cache/python"
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths: [.cache/uv, .cache/python]
  after_script:
    - uv cache prune --ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

tests:
  extends: .uv
  stage: test
  script:
    - uv sync --locked --extra dev
    - uv run python --version
    # `-c pyproject.toml` matters: pytest otherwise walks up and adopts an enclosing
    # project's config. The 3D view's tests drive headless Chrome, which is not in this
    # image, so they skip themselves rather than fail — everything else runs.
    # -rs so skips are named in the log. A silently skipped test is a test you
    # think you have.
    - uv run pytest -c pyproject.toml -rs

# The 3D view's tests drive a real browser, so `tests` above skips 16 of them for want
# of one. That is not a rounding error: those 16 are the entire regression suite for the
# WebGL renderer — no folded cells at any camera, the matrix agreeing with `project()` to
# a hundredth of a pixel, the texture not going blurry, a clockwise twist turning the map
# clockwise, context loss falling back, disposal returning the context. Two of those
# guard bugs found by looking at the output rather than by a test, which is exactly the
# kind that comes back. Skipped tests are silent, so they were passing invisibly.
#
# Chromium rather than a prebuilt Playwright image: the tests only need a binary called
# `google-chrome` or `chromium` on PATH, and Debian's package is the smaller way to get
# one. Software rendering is forced in the test flags, so no GPU is needed.
browser-tests:
  extends: .uv
  stage: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium
  script:
    - chromium --version
    - uv sync --locked --extra dev
    - uv run pytest -c pyproject.toml -rs
        tests/test_view3d_gl.py tests/test_view3d_gestures.py
  # Not yet proven on a runner, and a browser job that is flaky on its first day must not
  # be what stops the site deploying. Flip this off once it has gone green a few times —
  # a permanently-allowed-to-fail test job is decoration.
  allow_failure: true

# The job has to be called `pages`, and what it publishes has to be the `public/`
# artifact — that pairing is the whole contract. It runs after `tests` because of the
# stage order, so a red suite does not deploy.
pages:
  stage: deploy
  # Nearly irrelevant: this job builds nothing, it only hands GitLab the `public/`
  # directory. All it needs is a shell, and busybox covers `test`, `echo` and `du`.
  # Two things do matter — omitting `image:` makes gitlab.com's shared runners pull a
  # heavy default to run one `echo`, and `:latest` is a CI base that changes under you.
  image: alpine:3.20
  script:
    # Fail loudly rather than deploying an empty site: without this the job goes green
    # and publishes nothing, which looks like Pages being broken.
    - test -f public/index.html || (echo "no public/index.html to publish — build one locally, see the header of this file" && exit 1)
    # Every page in the nav strip, because the strip links to all of them from all of
    # them: a missing sibling is not a smaller site, it is three dead links on every
    # page that is there.
    - for page in airspace meteo planner; do test -f "public/$page/index.html" || (echo "no public/$page/index.html — the nav strip on every other page links to it" && exit 1); done
    - echo "publishing $(du -sh public | cut -f1) to $CI_PAGES_URL"
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
