# Deprecated. parainsights lives at github.com/ondrejchmelar/parainsights, and the site
# is built and published by `.github/workflows/pages.yml` — the reasoning behind every
# step of that build is there now.
#
# All this pipeline does is keep the old GitLab Pages address working: it publishes a
# site of redirect stubs, one per page, each sending the reader to the same path on
# GitHub Pages (`ci/redirect.sh`). No tests, no build — a second copy of the pipeline
# would only be a second place for it to drift.

pages:
  image: alpine:3.20
  script:
    - sh ci/redirect.sh
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
