# GitLab Pages for the tracklog viewer.
#
# The site is one static HTML file. Nothing is built here — building needs the IGC
# files, and flight tracks stay out of this repository (`*.igc` is ignored). Reports are
# built locally and the output is committed under `public/`:
#
#   uv run python -m tracklog_viewer.cli FLIGHT.igc [...] \
#       --terrain --meteo --online --html public/index.html
#
# `--online` is the reason for being on Pages at all. A published artifact runs under a
# policy that blocks every external host, which is what forced embedded imagery, an
# embedded DEM, a flat plane for uploaded tracks and a fake fullscreen. A page served
# from Pages can fetch, so imagery comes at view time at zoom 12–13 (10–20 m/px against
# the ~45 an embedded JPEG affords), weather works for a track the reader uploads, and
# the Fullscreen API is allowed.

stages: [test, deploy]

# The image carries uv and no Python at all — deliberately. Pinning an interpreter here
# as well as in `requires-python` is what let three versions drift apart (a 3.11 venv, a
# `>=3.12` floor, a 3.12 image, no two agreeing). `uv sync` reads `.python-version`,
# downloads that interpreter and refuses to build a venv that violates `requires-python`,
# so the version lives in one place and CI cannot disagree with a developer's machine.
#
# `--locked` is the other half: it fails if `uv.lock` does not match `pyproject.toml`
# rather than quietly resolving something newer. An upstream release can no longer turn
# this pipeline red on its own.
.uv:
  image: ghcr.io/astral-sh/uv:bookworm-slim
  interruptible: true
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.cache/python"
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths: [.cache/uv, .cache/python]
  after_script:
    - uv cache prune --ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

tests:
  extends: .uv
  stage: test
  script:
    - uv sync --locked --extra dev
    - uv run python --version
    # `-c pyproject.toml` matters: pytest otherwise walks up and adopts an enclosing
    # project's config. The 3D view's tests drive headless Chrome, which is not in this
    # image, so they skip themselves rather than fail — everything else runs.
    # -rs so skips are named in the log. A silently skipped test is a test you
    # think you have.
    - uv run pytest -c pyproject.toml -rs

# The 3D view's tests drive a real browser, so `tests` above skips 16 of them for want
# of one. That is not a rounding error: those 16 are the entire regression suite for the
# WebGL renderer — no folded cells at any camera, the matrix agreeing with `project()` to
# a hundredth of a pixel, the texture not going blurry, a clockwise twist turning the map
# clockwise, context loss falling back, disposal returning the context. Two of those
# guard bugs found by looking at the output rather than by a test, which is exactly the
# kind that comes back. Skipped tests are silent, so they were passing invisibly.
#
# Chromium rather than a prebuilt Playwright image: the tests only need a binary called
# `google-chrome` or `chromium` on PATH, and Debian's package is the smaller way to get
# one. Software rendering is forced in the test flags, so no GPU is needed.
browser-tests:
  extends: .uv
  stage: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium
  script:
    - chromium --version
    - uv sync --locked --extra dev
    - uv run pytest -c pyproject.toml -rs
        tests/test_view3d_gl.py tests/test_view3d_gestures.py
  # Not yet proven on a runner, and a browser job that is flaky on its first day must not
  # be what stops the site deploying. Flip this off once it has gone green a few times —
  # a permanently-allowed-to-fail test job is decoration.
  allow_failure: true

# What this job can and cannot build, and why the difference matters.
#
# **The report cannot be built here.** It needs the IGC files and flight tracks stay out
# of this repository, so `public/index.html` is a committed artifact — which is exactly
# how the site once sat weeks out of date behind a wall of green pipelines: the renderer
# changed, nobody rebuilt, and the job had nothing to notice with. `stale.sh` is what
# notices now. It asks whether the commit that last built the page contains the last
# change to everything that renders it, and fails when it does not. That is the whole
# guard: it cannot rebuild the page, but it can refuse to publish a page that no longer
# matches the code in the same commit.
#
# **The other three pages can be built here**, and are — `meteo` needs nothing but its
# own committed data, and `airspace` and `planner` fetch from public sources. Building
# them means three quarters of the site can never be stale, and the two that need a
# network fail the job rather than publishing yesterday's copy if a source is down.
pages:
  extends: .uv
  stage: deploy
  # A deploy is not interruptible: cancelling it half way through publishes nothing and
  # leaves the last deploy standing, which is a confusing state to debug.
  interruptible: false
  before_script:
    # Two packages, and both were learned the hard way on the first deploy.
    #
    # `git`, because `stale.sh` reads the history and the runner's helper image does the
    # clone — the job image is Debian slim with uv and nothing else. Without git the
    # check quietly answers "no idea" and passes, which is the exact failure it exists to
    # prevent, so `stale.sh` refuses to run rather than shrugging.
    #
    # `ca-certificates`, because this image has **no trust store at all** and
    # `--no-install-recommends` will not pull one in behind git. Nothing here noticed
    # until a page build tried to fetch: `uv` bundles its own roots and Debian's mirror
    # list is plain http, so everything before the first `urllib` call worked perfectly
    # and then Python said `CERTIFICATE_VERIFY_FAILED`.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
  script:
    - uv sync --locked
    # Fail loudly rather than deploying an empty site: without this the job goes green
    # and publishes nothing, which looks like Pages being broken.
    - test -f public/index.html || (echo "no public/index.html to publish — build one locally, see the header of this file" && exit 1)
    # The committed report against the code that renders it.
    - sh ci/stale.sh
    # The meteo page needs no network — its takeoff list and station map are committed
    # data — so there is no excuse for it not to build, and a failure here is a bug.
    - uv run python -m meteo.cli --html public/meteo/index.html
    # The other two fetch from four public sources. Those *are* allowed to be down, and
    # when they are the committed page is published instead of nothing: it is a few days
    # old at worst, and refusing to publish a rebuilt *report* because someone else's CSV
    # is unreachable is the wrong trade. Loud, and not fatal.
    # `--require-terrain` is what stops a rebuild being a downgrade. Without it a run
    # that cannot reach the elevation model writes the flat SVG map over the 3D one and
    # reports success — which is exactly what the first green deploy did.
    - 'uv run python -m airspaces.cli --html public/airspace/index.html --require-terrain || echo "WARNING: the airspace page could not be rebuilt, publishing the committed copy - check airspaces/sources.py"'
    - 'uv run python -m planner.cli --html public/planner/index.html || echo "WARNING: the planner page could not be rebuilt, publishing the committed copy"'
    # The airspace page links its OpenAir file by name and the name carries the AIRAC
    # date, so a half-finished rebuild can leave the page pointing at a file that is not
    # beside it. "Refuse to publish a site with a dead link in its own nav" already
    # covers the strip; this is the same rule for the one download button on the site.
    - sh ci/download-link.sh
    # Every page in the nav strip, because the strip links to all of them from all of
    # them: a missing sibling is not a smaller site, it is three dead links on every
    # page that is there.
    - for page in airspace meteo planner; do test -f "public/$page/index.html" || (echo "no public/$page/index.html — the nav strip on every other page links to it" && exit 1); done
    - echo "publishing $(du -sh public | cut -f1) to $CI_PAGES_URL"
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
