<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The planner has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="../airspace/">
<meta http-equiv="refresh" content="0; url=../airspace/">
<script>
try {
  var t = localStorage.getItem('parainsights.theme');
  if (t) document.documentElement.dataset.theme = t;
} catch (e) {}

location.replace('../airspace/' + location.search + location.hash);</script>
<style>
:root { --paper:#fff; --panel:#f7f7f5; --panel-2:#eeeeea; --rule:#dcdcd6;
  --ink:#1b1b19; --ink-2:#4a4a45; --ink-3:#82827a; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) { color-scheme: dark;
    --paper:#151513; --panel:#1e1e1b; --panel-2:#262622; --rule:#3a3a34;
    --ink:#eeeee8; --ink-2:#c0c0b8; --ink-3:#8a8a80; }
}
:root[data-theme="dark"] { color-scheme: dark;
  --paper:#151513; --panel:#1e1e1b; --panel-2:#262622; --rule:#3a3a34;
  --ink:#eeeee8; --ink-2:#c0c0b8; --ink-3:#8a8a80; }

body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55
  system-ui,-apple-system,"Segoe UI",sans-serif; padding:26px 18px; }
a { color:inherit; }</style>
<p>The task planner is now part of the
<a href="../airspace/">airspace page</a>.</p>
