[project]
name = "parainsights"
version = "0.0.1"
description = "Tools for paragliding flight analysis"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "timezonefinder>=6",
]


[project.optional-dependencies]
# Pillow is optional at *runtime* — basemap stitching and the KMZ barogram import it
# lazily — but the test suite is not optional about it: the icon test decodes every
# generated PNG, which is the check that caught a corrupt IDAT that Google Earth drew as
# a red X on every placemark. Installing only `[dev]` left CI without PIL and failed
# there while passing locally, where a stray Pillow happened to be present.
dev = ["pytest>=8", "pillow>=10"]
terrain = ["pillow>=10"]

[project.scripts]
tracklog-viewer = "tracklog_viewer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracklog_viewer*"]

# Set explicitly so pytest does not walk up and adopt an enclosing project's config.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
