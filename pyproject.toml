[project]
name = "parainsights"
version = "0.0.1"
description = "Tools for paragliding flight analysis"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
]


[project.optional-dependencies]
# Pillow decodes the terrain tiles a build fetches (`terrain.fetch`). Optional, because
# a page built without --terrain needs none, and the tests that decode tiles need it too.
# Node is the other build requirement and is not a Python package: the analysis and the
# articles are the JavaScript in tracklog_viewer/js/ (`js_build.py`).
dev = ["pytest>=8", "pytest-xdist>=3", "pillow>=10"]
terrain = ["pillow>=10"]

[project.scripts]
tracklog-viewer = "tracklog_viewer.cli:main"
airspaces = "airspaces.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracklog_viewer*", "airspaces*", "meteo*", "planner*", "parainsights_common*",
           "parainsights_map*"]

# The analysis and the articles, in JavaScript: read from beside the package, not imported.
[tool.setuptools.package-data]
tracklog_viewer = ["js/*.js"]

# Set explicitly so pytest does not walk up and adopt an enclosing project's config.
[tool.pytest.ini_options]
testpaths = ["tests"]
# In parallel, one worker per core. Most of the suite is headless Chrome, one process
# per test and mostly waiting, so it parallelises well. `--dist loadfile` keeps a file's
# tests on one worker: the browser tests share module-level fixtures and fixture servers.
addopts = "-q -n auto --dist loadfile"

[tool.ruff]
line-length = 100
